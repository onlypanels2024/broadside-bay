# Checks the live drawing checker end to end (two test drawings through the real referee).
# Runs by hand from the Actions tab, or when this file or the test script changes. Result goes to branch checker-log-<run id>.
name: Test drawing checker
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/checker-test.yml", "tools/checker-test.js"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
        working-directory: functions
      - name: Check two drawings
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/raw.txt"
          python3 - "$RUNNER_TEMP/raw.txt" "$RUNNER_TEMP/sa.json" <<'PY'
          import json, sys, base64
          raw = open(sys.argv[1]).read().strip()
          for c in (raw, base64.b64decode(raw + '==').decode('utf-8', 'ignore') if raw and raw[0] != '{' else ''):
              try: d = json.loads(c); json.dump(d, open(sys.argv[2], 'w')); sys.exit(0)
              except Exception: pass
          sys.exit('bad key')
          PY
          node tools/checker-test.js "$RUNNER_TEMP/sa.json" "$RUNNER_TEMP/result.txt"
          git config user.name "deploy-bot"; git config user.email "deploy-bot@users.noreply.github.com"
          git checkout -q --orphan "checker-log-$GITHUB_RUN_ID" && git rm -rqf --cached . >/dev/null 2>&1 || true
          cp "$RUNNER_TEMP/result.txt" checker-result.txt && git add -f checker-result.txt
          git commit -qm "Checker test $GITHUB_RUN_ID" && git push -q origin "checker-log-$GITHUB_RUN_ID"
