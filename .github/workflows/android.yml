# Builds the Broadside Bay Android app. Every push to main makes a new release with:
#  - BroadsideBay.apk  : install on a phone directly
#  - BroadsideBay.aab  : upload to Google Play
name: Build Android app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["www/**", "android-app/**", ".github/workflows/android.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android-app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Copy the game into the app
        run: rm -rf www && cp -r ../www ./www
      - run: npm install --no-audit --no-fund
      - run: npx cap add android
      - name: Google sign-in setup
        run: |
          if [ -f google-services.json ]; then cp google-services.json android/app/; else echo "::warning::google-services.json missing - Google sign-in will not work in this build"; fi
          # include the Google provider of the sign-in plugin
          sed -i 's/^ext {/ext {\n    rgcfaIncludeGoogle = true/' android/variables.gradle
      - name: Turn with the phone (portrait and landscape)
        run: |
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity"\n            android:screenOrientation="fullUser"/' android/app/src/main/AndroidManifest.xml
          grep -n "screenOrientation" android/app/src/main/AndroidManifest.xml
          # notifications need permission on Android 13+
          grep -q POST_NOTIFICATIONS android/app/src/main/AndroidManifest.xml || sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />#' android/app/src/main/AndroidManifest.xml
          grep -n "uses-permission" android/app/src/main/AndroidManifest.xml
          # Google AdMob needs the app's AdMob ID
          sed -i 's#</application>#    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-7319579555027884~5484111524"/>\n    </application>#' android/app/src/main/AndroidManifest.xml
          grep -n "APPLICATION_ID" android/app/src/main/AndroidManifest.xml
      - name: Full screen (hide the status and navigation bars, use the whole screen around the camera)
        run: |
          F=$(find android/app/src/main/java -name MainActivity.java)
          PKG=$(grep -m1 '^package' "$F")
          cat > "$F" <<JAVA
          $PKG
          import android.os.Build;
          import android.os.Bundle;
          import android.view.WindowManager;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              if (Build.VERSION.SDK_INT >= 28) getWindow().getAttributes().layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              hideBars();
            }
            @Override public void onWindowFocusChanged(boolean hasFocus) { super.onWindowFocusChanged(hasFocus); if (hasFocus) hideBars(); }
            private void hideBars() {
              WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
              WindowInsetsControllerCompat c = WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
              c.hide(WindowInsetsCompat.Type.systemBars());
              c.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
            }
          }
          JAVA
          sed -i 's/^          //' "$F"
          cat "$F"
      - name: App icon and splash
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#071a24' --splashBackgroundColor '#071a24'
      - run: npx cap sync android
      - name: Signing key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ]; then echo "::warning::No signing key secret - building a debug app"; exit 0; fi
          echo "$KS" | base64 -d > android/app/release.jks
          cat >> android/app/build.gradle <<GRADLE
          android {
            signingConfigs { release { storeFile file("release.jks"); storePassword System.getenv("KS_PASS"); keyAlias "overboard"; keyPassword System.getenv("KS_PASS") } }
            buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
          }
          GRADLE
      - name: Build
        working-directory: android-app/android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
        run: |
          VC=$(( $(date +%s) / 60 - 29000000 ))
          sed -i "s/versionCode [0-9]*/versionCode $VC/; s/versionName \"[^\"]*\"/versionName \"1.0.$GITHUB_RUN_NUMBER\"/" app/build.gradle
          if [ "$HAS_KEY" = "true" ]; then
            ./gradlew assembleRelease bundleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../BroadsideBay.apk
            cp app/build/outputs/bundle/release/app-release.aab ../BroadsideBay.aab
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../BroadsideBay.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: BroadsideBay
          path: |
            android-app/BroadsideBay.apk
            android-app/BroadsideBay.aab
          if-no-files-found: warn
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Broadside Bay 1.0.${{ github.run_number }}
          make_latest: true
          body: Download BroadsideBay.apk on your phone and open it to install or update. BroadsideBay.aab is for Google Play.
          files: |
            android-app/BroadsideBay.apk
            android-app/BroadsideBay.aab
