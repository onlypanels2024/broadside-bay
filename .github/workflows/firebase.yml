# Deploys the referee (Cloud Functions) and the database security rules to Firebase.
name: Deploy referee and rules
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["functions/**", "database.rules.json", "firebase.json", ".github/workflows/firebase.yml"]
jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Test referee and rules
        run: npm install --no-audit --no-fund && npm test
      - run: npm install --no-audit --no-fund
        working-directory: functions
      - name: Deploy
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT: ${{ vars.FIREBASE_PROJECT_ID || secrets.FIREBASE_PROJECT_ID || 'overboard-2104' }}
        run: |
          if [ -z "$SA" ]; then echo "::warning::Missing secret FIREBASE_SERVICE_ACCOUNT - tests ran, nothing deployed"; exit 0; fi
          # accept the key as pasted JSON or as base64; describe (never print) what was found if it is wrong
          printf '%s' "$SA" > "$RUNNER_TEMP/raw.txt"
          python3 - "$RUNNER_TEMP/raw.txt" "$RUNNER_TEMP/sa.json" <<'PY'
          import json, sys, base64
          raw = open(sys.argv[1], encoding='utf-8', errors='replace').read().strip()
          cands = [raw]
          try: cands.append(base64.b64decode(raw).decode())
          except Exception: pass
          for c in cands:
              try:
                  d = json.loads(c)
              except Exception:
                  continue
              if isinstance(d, dict) and d.get('type') == 'service_account' and d.get('private_key') and d.get('client_email'):
                  json.dump(d, open(sys.argv[2], 'w')); print('Service account OK for project', d.get('project_id')); sys.exit(0)
              keys = sorted(d.keys()) if isinstance(d, dict) else type(d).__name__
              print('::error::The secret is JSON but not a service-account key. Fields found: %s' % keys); sys.exit(1)
          print('::error::The secret is not JSON. Length %d characters, starts with %r, ends with %r' % (len(raw), raw[:2], raw[-2:])); sys.exit(1)
          PY
          echo "Deploying to Firebase project: $PROJECT" 
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          set -o pipefail
          if ! npx --yes firebase-tools@13 deploy --only database,functions --project "$PROJECT" --non-interactive --force 2>&1 | tee deploy.log; then
            # surface the important lines where they can be read without opening the full log
            grep -iE "error|denied|permission|missing|required|enable|billing" deploy.log | tail -15 | while read -r l; do echo "::error::$l"; done
            exit 1
          fi
          grep -iE "Deploy complete|Successful|released rules" deploy.log | while read -r l; do echo "::notice::$l"; done
