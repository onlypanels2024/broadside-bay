# Deploys the referee (Cloud Functions) and the database security rules to Firebase.
name: Deploy referee and rules
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["functions/**", "database.rules.json", "firebase.json", ".github/workflows/firebase.yml"]
jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Test referee and rules
        run: npm install --no-audit --no-fund && npm test
      - run: npm install --no-audit --no-fund
        working-directory: functions
      - name: Deploy
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$SA" ] || [ -z "$PROJECT" ]; then echo "::warning::Firebase not connected yet - tests ran, nothing deployed"; exit 0; fi
          echo "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@13 deploy --only database,functions --project "$PROJECT" --non-interactive --force
