# Read-only diagnostics: shows the referee's status flags and its recent error logs (never prints the key).
name: Referee diagnostics
permissions:
  contents: write
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
        working-directory: functions
      - name: Status and logs
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/raw.txt"
          python3 - "$RUNNER_TEMP/raw.txt" "$RUNNER_TEMP/sa.json" <<'PY'
          import json,sys,base64
          raw=open(sys.argv[1]).read().strip()
          for c in (raw,):
              pass
          try: d=json.loads(raw)
          except Exception: d=json.loads(base64.b64decode(raw).decode())
          json.dump(d,open(sys.argv[2],'w'))
          PY
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          exec > "$RUNNER_TEMP/out.txt" 2>&1
          cd functions && node -e "
          const admin=require('firebase-admin');admin.initializeApp({databaseURL:'https://overboard-2104-default-rtdb.europe-west1.firebasedatabase.app'});
          (async()=>{const s=(await admin.database().ref('status').get()).val();console.log('STATUS',JSON.stringify(s,null,1));
          const r=(await admin.database().ref('requests').limitToLast(5).get()).val();console.log('PENDING REQUESTS',JSON.stringify(r));const sv=(await admin.database().ref('saves').get()).val()||{};const now=Date.now();for(const [u,x] of Object.entries(sv)){if(x&&x.dchk&&now-(x.dchk.t||0)<6*3600e3)console.log('RECENT CHECK',u.slice(0,10),JSON.stringify({dchk:x.dchk,dok:x.dok,last:x.last,chk:x.chk,lk:x.lk,look:x.look,paint:x.paint,dw:x.dw}));}process.exit(0)})().catch(e=>{console.log('ERR',e.message);process.exit(0)})"
          node -e "
          const admin=require('firebase-admin');try{admin.initializeApp()}catch(e){}const D=require('./drawcheck');
          (async()=>{for(const [n,dw] of [['gary smiley','000000000000000001f00f881e0c1414300424042004200c21883010182007c0'],['test smiley','00000000000000000000042000000000000000000810042003c0000000000000']]){try{console.log('AI TEST',n,JSON.stringify(await D.aiCheck(dw,false)))}catch(e){console.log('AI TEST',n,'ERR',e.message)}}process.exit(0)})()"
          for SITE in broadsidebay broadside-bay broadsidebay-game; do echo "SITE TRY $SITE"; npx --yes firebase-tools@14 hosting:sites:create $SITE --project overboard-2104 --non-interactive 2>&1 | grep -iE "site|error|already|created|available" | head -4; if npx --yes firebase-tools@14 hosting:sites:list --project overboard-2104 --non-interactive 2>/dev/null | grep -q " $SITE "; then echo "SITE OK $SITE"; break; fi; done
          npx --yes firebase-tools@14 hosting:sites:list --project overboard-2104 --non-interactive 2>&1 | tail -8
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS" --quiet >/dev/null 2>&1 || true
          gcloud logging read 'resource.type="cloud_run_revision" AND (severity>=WARNING OR textPayload:"drawing")' --project overboard-2104 --freshness=12h --limit 25 --format='value(timestamp,severity,textPayload,jsonPayload.message,jsonPayload.err)' 2>&1 | cut -c1-400 || true
      - name: Save the report to the diag-out branch
        if: always()
        run: |
          cp "$RUNNER_TEMP/out.txt" /tmp/out.txt || echo none > /tmp/out.txt
          git config user.name diag && git config user.email diag@users.noreply.github.com
          git checkout --orphan diag-out && git rm -rqf . && cp /tmp/out.txt report.txt && git add report.txt && git commit -qm report && git push -f origin diag-out
